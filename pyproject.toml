[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hiplot-mm"
version = "0.0.4rc17"
description = "High dimensional Interactive Plotting tool"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Facebook AI Research" },
    { name = "mathematicalmichael @ Mind the Math, LLC" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Visualization",
]

# Core dependencies - minimal set needed for basic functionality
dependencies = [
    "beautifulsoup4",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
# Web server support (hiplot CLI command)
server = [
    "flask",
    "flask-compress",
]

# Jupyter notebook support (experiment.display())
notebook = [
    "ipython>=7.0.1",
    "ipykernel",
]

# Streamlit support (experiment.display_st())
streamlit = [
    "streamlit>=0.63",
]

# All optional dependencies
all = ["hiplot-mm[server,notebook,streamlit]"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "coverage>=7.6",
    "diff-cover>=9.2",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "ruff>=0.14",
    "ipykernel",
    "pandas",
    "streamlit>=0.63",
    "beautifulsoup4",
    "optuna",
    "flask",
    "flask-compress",
    "ipython>=7.0.1",
]
docs = [
    "sphinx==5.2.0",
    "guzzle_sphinx_theme==0.7.11",
    "m2r2>=0.3.4",
]

[project.scripts]
hiplot = "hiplot.server:run_server_main"
hiplot-render = "hiplot.render:hiplot_render_main"
hiplot-mm = "hiplot.render:hiplot_render_main"

[project.urls]
Homepage = "https://github.com/mindthemath/hiplot"
Documentation = "https://mindthemath.github.io/hiplot/"
Repository = "https://github.com/mindthemath/hiplot"

[tool.hatch.build]
# Force-include the built JS bundles (gitignored but needed at runtime)
[tool.hatch.build.force-include]
"hiplot/static/built" = "hiplot/static/built"

[tool.hatch.build.targets.wheel]
packages = ["hiplot"]
exclude = [
    "hiplot/tests/",
    "hiplot/static/*.svg",
    "hiplot/static/logo.png",
]

[tool.hatch.build.targets.sdist]
include = [
    "hiplot/**",
    "LICENSE",
    "NOTICE",
    "README.md",
    "pyproject.toml",
]
exclude = [
    "hiplot/tests/",
    "examples/",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["hiplot/tests", "tools"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
extend-exclude = ["docs/_build", "npm-dist", "node_modules"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",       # imports
    "UP",      # outdated constructs
    "B",       # likely bugs
    "SIM",     # needless complexity
    "C4",      # unnecessary comprehensions
    "RET",     # confused returns
    "ARG",     # unused arguments
    "PTH",     # pathlib consistency
    "PERF",    # obvious performance mistakes
    "RUF",
    "PGH",     # blanket noqa / type: ignore without a code
    "ISC",     # implicit string concatenation
    "PIE",     # misc slop (duplicate class fields, pointless placeholders)
    "ERA",     # commented-out code
]
ignore = [
    "ISC001",  # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures and mocks take arguments they don't always use.
"hiplot/tests/**" = ["ARG"]
"tools/test_*.py" = ["ARG"]

[tool.mypy]
strict = true
explicit_package_bases = true
ignore_missing_imports = true
exclude = ['^\.venv/', '^docs/_build/', '^node_modules/', '^npm-dist/']

[tool.coverage.run]
branch = true
relative_files = true
source = ["hiplot"]
omit = ["hiplot/tests/*"]
