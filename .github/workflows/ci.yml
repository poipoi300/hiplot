# Durable enforcement of the anti-slop gates. Pre-commit hooks can be bypassed
# with --no-verify; this runs the same checks on every push and PR so nothing
# lands unchecked. One job per language for the fast gates, the Playwright
# suite, then the stack test + diff-coverage gate that consumes its coverage.
name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.1"
  UV_VERSION: "0.13.7"

jobs:
  python-lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install dev tools
        run: uv sync --group dev
      - name: ruff format (check only)
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy .

  web-lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: biome (check only)
        run: bun run biome check --error-on-warnings .
      - name: tsc
        run: bun run typecheck

  build-js:
    uses: ./.github/workflows/build-js.yml

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          uv sync --extra server
          bun run playwright install --with-deps chromium
      - name: Playwright against an instrumented bundle
        run: bash tools/e2e_coverage.sh
      - name: Upload end-to-end coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-coverage
          path: coverage/e2e/lcov.info
          retention-days: 7
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  tests-and-coverage:
    needs: [playwright, build-js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # diff-cover needs history to compare against main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: hiplot/static/built/
      - name: Download end-to-end coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-coverage
          path: coverage/e2e/
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          uv sync --group dev
      - name: Tests + diff coverage (Python, bun, Playwright)
        env:
          E2E_LCOV: coverage/e2e/lcov.info
        run: bash tools/stack_coverage_gate.sh

  python-versions:
    name: pytest (Python ${{ matrix.python-version }})
    needs: build-js
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: hiplot/static/built/
      - name: Install dependencies
        run: uv sync --group dev
      - name: pytest
        run: uv run pytest --durations=10
      - name: CLI entry points
        run: |
          uv run --extra server hiplot --help
          uv run hiplot-render --help
          uv run hiplot-plus --help

  windows:
    needs: build-js
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.12"
      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: hiplot/static/built/
      - name: Install dependencies
        run: uv sync --group dev
      - name: pytest
        run: uv run pytest
      - name: CLI entry points
        run: |
          uv run --extra server hiplot --help
          uv run hiplot-render --help
          uv run hiplot-plus --help

  package-verify:
    needs: build-js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: hiplot/static/built/
      - name: Build package
        run: uv build
      - name: Verify wheel install
        run: |
          uv venv test-wheel
          VIRTUAL_ENV=test-wheel uv pip install dist/*.whl
          test-wheel/bin/python -c "import hiplot as hip; print(hip.__version__)"
          test-wheel/bin/hiplot-render demo --format html > demo.html
          grep -q "hiplot.render" demo.html
      - name: Verify sdist install
        run: |
          uv venv test-sdist
          VIRTUAL_ENV=test-sdist uv pip install dist/*.tar.gz
          test-sdist/bin/python -c "import hiplot as hip; hip.Experiment"
          test-sdist/bin/hiplot-render demo --format html > /dev/null
      - name: Upload package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: dist/
          retention-days: 7

  docs:
    needs: build-js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: hiplot/static/built/
      - name: Build Sphinx docs
        run: uv run --no-default-groups --group docs sphinx-build -b html docs docs/_build/html
