# Hosted lint, types, unit tests, builds, and compatibility checks.
# Browser tests and combined diff coverage run locally in the pre-push hook.
name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.1"
  UV_VERSION: "0.13.7"

jobs:
  rust-lint-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rustfmt
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --locked

  python-lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # Tools only: installing the project needs the built JS bundle, which
      # this job has no use for.
      - name: Install dev tools
        run: uv sync --group dev --no-install-project
      - name: ruff format (check only)
        run: uv run --no-sync ruff format --check .
      - name: ruff check
        run: uv run --no-sync ruff check .
      - name: mypy
        run: uv run --no-sync mypy .

  web-lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: biome (check only)
        run: bun run biome check --error-on-warnings .
      - name: tsc
        run: bun run typecheck

  build-js:
    uses: ./.github/workflows/build-js.yml

  unit-tests:
    needs: build-js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: hiplot/static/built/
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          uv sync --group dev
      - name: Python tests
        run: uv run pytest -q
      - name: Frontend and tooling unit tests
        run: bun test ./src ./tools

  python-versions:
    name: pytest (Python ${{ matrix.python-version }})
    needs: build-js
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: hiplot/static/built/
      - name: Install dependencies
        run: uv sync --group dev
      - name: pytest
        run: uv run pytest --durations=10
      - name: CLI entry points
        run: |
          uv run --extra server hiplot --help
          uv run hiplot-render --help
          uv run hiplot-plus --help

  windows:
    needs: build-js
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.12"
      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: hiplot/static/built/
      - name: Install dependencies
        run: uv sync --group dev
      - name: pytest
        run: uv run pytest
      - name: CLI entry points
        run: |
          uv run --extra server hiplot --help
          uv run hiplot-render --help
          uv run hiplot-plus --help

  package-verify:
    needs: build-js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: hiplot/static/built/
      - name: Build package
        run: uv build
      - name: Check the wheel carries the bundles
        # Hatch skips missing artifacts silently.
        run: |
          unzip -l dist/*.whl | grep -q "hiplot/static/built/hiplot.bundle.js"
          unzip -l dist/*.whl | grep -q "hiplot/static/built/streamlit_component/hiplot_streamlit.bundle.js"
      - name: Verify wheel install
        run: |
          uv venv test-wheel
          VIRTUAL_ENV=test-wheel uv pip install dist/*.whl
          test-wheel/bin/python -c "import hiplot as hip; print(hip.__version__)"
          test-wheel/bin/hiplot-render demo --format html > demo.html
          grep -q "hiplot.render" demo.html
      - name: Verify sdist install
        run: |
          uv venv test-sdist
          VIRTUAL_ENV=test-sdist uv pip install dist/*.tar.gz
          test-sdist/bin/python -c "import hiplot as hip; hip.Experiment"
          test-sdist/bin/hiplot-render demo --format html > /dev/null
      - name: Upload package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: dist/
          retention-days: 7

  docs:
    needs: build-js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: hiplot/static/built/
      - name: Build Sphinx docs
        run: uv run --no-default-groups --group docs sphinx-build -b html docs docs/_build/html
