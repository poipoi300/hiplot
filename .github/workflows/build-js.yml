# Builds the JavaScript bundles once and shares them as the `js-bundle`
# artifact, so CI, docs, and release do not each repeat the Vite build.
name: Build JavaScript

on:
  workflow_call:
    inputs:
      retention-days:
        description: Days to keep the js-bundle artifact
        type: number
        default: 7

permissions:
  contents: read

jobs:
  build-js:
    name: Build JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.1"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build bundles
        run: bun run build
      - name: Upload bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: hiplot/static/built/
          retention-days: ${{ inputs.retention-days }}
